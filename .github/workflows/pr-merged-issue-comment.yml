name: Link merged PR to closed issues

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  issues: write
  pull-requests: read

jobs:
  comment-linked-issues:
    name: Comment PR link on closed issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Link merged PR on referenced issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const numbers = new Set();
            const regex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            for (const match of body.matchAll(regex)) {
              numbers.add(Number(match[1]));
            }
            const branchMatch = /^(\d+)-/.exec(pr.head.ref || "");
            if (branchMatch) {
              numbers.add(Number(branchMatch[1]));
            }

            const statusLabels = ["in-progress", "needs-attention", "ready-for-review"];
            for (const issueNumber of numbers) {
              if (!Number.isInteger(issueNumber) || issueNumber <= 0) continue;
              const marker = `Closed by ${pr.html_url}`;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              if (!comments.some((c) => (c.body || "").includes(pr.html_url))) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `${marker} (merged into ${pr.base.ref}).`,
                });
              }
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              if (issue.state !== "closed") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: "closed",
                });
              }
              for (const label of issue.labels) {
                const name = typeof label === "string" ? label : label.name;
                if (name && statusLabels.includes(name)) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      name,
                    });
                  } catch (err) {
                    if (err.status !== 404) throw err;
                  }
                }
              }
            }
