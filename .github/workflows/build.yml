name: Build

on:
  push:
  pull_request:

# Push and pull_request share a branch name. Keep their groups apart so the
# skipped same-repo pull_request run does not cancel the push run that does the work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  build:
    name: Build, test, and render screenshots
    # Push already checks same-repo pull requests. Fork pull requests have no push event here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7

      - name: Assign open pull request to WillCraig
        if: github.event_name == 'push' && github.ref_name != 'main'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: `${context.repo.owner}:${context.ref.replace("refs/heads/", "")}`,
            });
            for (const pr of prs) {
              if (!pr.assignees || !pr.assignees.some((a) => a.login === "WillCraig")) {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  assignees: ["WillCraig"],
                });
              }
            }

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test, and render Java2D screenshots
        run: ./gradlew build test renderScreenshots renderExampleScreenshots verifyDistributionExcludesExamples --stacktrace

      - name: Upload progress-bar screenshots
        uses: actions/upload-artifact@v7
        with:
          name: brandbar-screenshots
          if-no-files-found: error
          path: build/reports/screenshots/*.png

      - name: Upload example-theme screenshots
        uses: actions/upload-artifact@v7
        with:
          name: brandbar-example-screenshots
          if-no-files-found: error
          path: build/reports/example-screenshots/**

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          if-no-files-found: ignore
          path: build/reports/tests/**

  integration:
    name: IDE smoke test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          preinstalled-runtimes: false
          swap-storage: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Starter launches the IDE with `xvfb-run` when DISPLAY is unset.
      # ubuntu-latest does not ship xvfb-run by default.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Boot a real IDE, verify ProgressBarUI, and capture screenshot
        run: ./gradlew integrationTest --stacktrace

      - name: Upload in-IDE screenshot
        uses: actions/upload-artifact@v7
        with:
          name: brandbar-ide-screenshot
          if-no-files-found: error
          path: build/reports/ide-screenshots/*.png

      - name: Upload IDE logs and test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ide-smoke-logs
          if-no-files-found: ignore
          path: |
            out/ide-tests/tests/**/log/**
            build/reports/tests/**

  verify-stable:
    name: Verify stable IDEs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          preinstalled-runtimes: false
          swap-storage: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify sinceBuild 243 and latest stable IDEs
        run: ./gradlew verifyPlugin --stacktrace

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-stable
          if-no-files-found: ignore
          path: build/reports/pluginVerifier/**

  verify-eap:
    name: Verify EAP IDEs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          preinstalled-runtimes: false
          swap-storage: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify latest EAP IDEs
        id: eap
        continue-on-error: true
        run: ./gradlew verifyPlugin -Pbrandbar.verifierChannel=eap --stacktrace

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-eap
          if-no-files-found: ignore
          path: build/reports/pluginVerifier/**

      - name: Open or update the needs-attention issue
        if: steps.eap.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_ATTENTION_REASON: Plugin Verifier failed on the latest IntelliJ IDEA Community and Ultimate EAP builds. This check does not block the pull request.
        run: python3 .github/scripts/open_needs_attention.py
